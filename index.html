.home-edit-btn{border:1px solid var(--line);background:#0b1726;color:var(--aqua);border-radius:10px;padding:10px 12px;font-size:10px} .home-settings-btn{width:42px;height:42px;border:1px solid var(--line);background:#0b1726;color:#dff7ff;border-radius:12px;font-size:20px;display:inline-flex;align-items:center;justify-content:center}.home-settings-btn:active{transform:scale(.96)} .settings-menu-card{border:1px solid var(--line);background:#081522;border-radius:14px;padding:12px;margin-top:10px}.settings-menu-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 4px;border-bottom:1px solid rgba(255,255,255,.07)}.settings-menu-row:last-child{border-bottom:0}.settings-menu-row>div{min-width:0;flex:1}.settings-menu-row b{display:block;color:#f2f9ff;white-space:normal;word-break:keep-all;overflow-wrap:anywhere;line-height:1.45}.settings-menu-row span{display:block;color:#cfe3ef;font-size:11px;margin-top:3px;line-height:1.55;white-space:normal;word-break:keep-all;overflow-wrap:anywhere}.settings-menu-row>.secondary{flex:0 0 auto;white-space:nowrap;min-width:max-content}.settings-section span{color:#cfe3ef}.settings-section label{white-space:normal;word-break:keep-all;line-height:1.45}.settings-section input,.settings-section select,.settings-section textarea{color:#f3fbff!important;background:#06101c!important}.settings-section input::placeholder,.settings-section textarea::placeholder{color:#9fb6c5!important}.home-edit-banner{display:none;margin:-12px 0 14px;padding:10px 12px;border:1px dashed var(--aqua);border-radius:12px;background:#071a28;color:#a9dff0;font-size:10px}.home-edit-banner.show{display:block}.home-layout-edit .home-sortable{position:relative;outline:1px dashed rgba(54,215,255,.45);border-radius:12px;cursor:grab;user-select:none}.home-layout-edit .home-sortable:before{content:'⠿';position:absolute;right:10px;top:8px;z-index:2;color:var(--aqua);font-size:18px;line-height:1}.home-layout-edit .home-sortable.dragging{opacity:.8 <body>
<header><div class="brand"><div class="brand-mark" aria-hidden="true"><span>LK</span></div><div><h1>LIFE KEEPER</h1><p>LIVESTOCK KEEPING LOG</p></div></div></header>
<main id="app"></main>
<button class="fab" onclick="openTank()" aria-label="飼育環境を追加">＋</button>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>

<script>
const KEY="aqua_log_v1";
let data=JSON.parse(localStorage.getItem(KEY)||'{"tanks":[],"logs":[]}');
data.tanks=Array.isArray(data.tanks)?data.tanks:[];data.logs=Array.isArray(data.logs)?data.logs:[];data.feedPresets=Array.isArray(data.feedPresets)?data.feedPresets:["おとひめ","冷凍赤虫","クリル","人工飼料"];data.calendarMemos=Array.isArray(data.calendarMemos)?data.calendarMemos:[];data.features={calendar:true,dashboard:true,latest:true,recent:true,backup:true,plants:true,waterQuality:true,compatibility:true,feeding:true,...(data.features||{})};data.homeOrder=Array.isArray(data.homeOrder)?data.homeOrder:["summary","dashboard","latest","recent","allHistory"];
let currentTank=null;

// 最新情報更新：24時間以内はキャッシュを使用し、必要なときだけ /api/latest を呼び出す。
const LATEST_KEY="aqua_log_latest_v1";
const LATEST_TTL=24*60*60*1000;
function latestCache(){try{return JSON.parse(localStorage.getItem(LATEST_KEY)||'{}')}catch(e){return {}}}
function saveLatestCache(x){try{localStorage.setItem(LATEST_KEY,JSON.stringify(x))}catch(e){}}
function latestDate(ts){return ts?new Date(ts).toLocaleString('ja-JP',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'}):'未確認'}
function setLatestStatus(text,cls=''){const el=document.getElementById('latestStatus');if(el){el.className='latest-status '+cls;el.innerHTML=text}}
function localLatestText(){const c=latestCache();return c.checkedAt?`🔄 最新情報：${latestDate(c.checkedAt)} <button onclick="refreshLatestInfo(true)">更新</button>`:`⏳ 最新情報を確認中…`}
async function refreshLatestInfo(force=false){
 const cache=latestCache();
 if(!force && cache.checkedAt && Date.now()-cache.checkedAt<LATEST_TTL){setLatestStatus(localLatestText(),'ok');return cache}
 const names=[...new Set((data.tanks||[]).flatMap(t=>(t.fish||[]).map(f=>f.name||f.species||'').filter(Boolean)))];
 if(!navigator.onLine){setLatestStatus(cache.checkedAt?`📴 オフライン：前回 ${latestDate(cache.checkedAt)} の情報を使用`:'📴 オフライン：保存情報を使用','warn');return cache}
 if(!names.length){setLatestStatus('🐟 生体登録後に最新情報を確認します','');return cache}
 setLatestStatus('🔄 最新情報を確認中…','');
 try{
   const res=await fetch('/api/latest?species='+encodeURIComponent(names.join('|')),{headers:{'Accept':'application/json'},cache:'no-store'});
   if(!res.ok) throw new Error('HTTP '+res.status);
   const fresh=await res.json();
   const next={...fresh,checkedAt:Date.now(),species:names};
   saveLatestCache(next);
   setLatestStatus(`✅ 最新情報を更新：${latestDate(next.checkedAt)} <button onclick="refreshLatestInfo(true)">更新</button>`,'ok');
   window.dispatchEvent(new CustomEvent('aquaLatestUpdated',{detail:next}));
   return next;
 }catch(e){
   setLatestStatus(cache.checkedAt?`⚠ 更新できませんでした（前回 ${latestDate(cache.checkedAt)}）`:'⚠ 最新情報を取得できませんでした','warn');
   return cache;
 }
}
function latestInfoFor(name){const c=latestCache();return c.items&&c.items[name]||null}

let selectedTankId=null;
let modalScrollY=0;

function save(){const y=window.scrollY||window.pageYOffset||0;localStorage.setItem(KEY,JSON.stringify(data));render();requestAnimationFrame(()=>requestAnimationFrame(()=>window.scrollTo({top:y,left:0,behavior:"auto"}))) }
window.addEventListener("pagehide",()=>{try{localStorage.setItem(KEY,JSON.stringify(data))}catch(e){}})
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function today(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function closeModal(){const y=modalScrollY||0;document.getElementById("modal").classList.remove("open");document.body.classList.remove("modal-lock");document.body.style.top="";requestAnimationFrame(()=>requestAnimationFrame(()=>window.scrollTo({top:y,left:0,behavior:"auto"}))) }
function openModal(html){modalScrollY=window.scrollY||window.pageYOffset||0;document.getElementById("sheet").innerHTML=html;document.getElementById("modal").classList.add("open");document.body.style.top=`-${modalScrollY}px`;document.body.classList.add("modal-lock") }
document.getElementById("modal")?.addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
function openImagePreview(src,title="写真"){if(!src)return;openModal(`<div class="row"><div class="title">${esc(title)}</div><button class="secondary" onclick="closeModal()">閉じる</button></div><div class="image-preview-modal"><img src="${src}" alt="${esc(title)}"></div>`)}
function readItemPhoto(input){const f=input.files?.[0],row=input.closest(".fish-item,.plant-item");if(!f||!row)return;if(f.size>10*1024*1024){alert("写真は10MB以下にしてください。");input.value="";return}const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=1000,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext("2d").drawImage(img,0,0,c.width,c.height);const src=c.toDataURL("image/jpeg",.78);row.dataset.photo=src;const box=row.querySelector(".item-photo-btn");if(box)box.innerHTML=`<img class="item-thumb" src="${src}" alt="写真" onclick="openImagePreview(this.src,'写真')"><input type="file" accept="image/*" onchange="readItemPhoto(this)">`;};img.src=r.result;};r.readAsDataURL(f)}

const categoryMeta={aquarium:{label:"アクアリウム",icon:"🐟",env:"水槽",plural:"魚",intro:"生体の導入日"},reptile:{label:"爬虫類",icon:"🦎",env:"飼育ケージ",plural:"爬虫類",intro:"生体の導入日"},amphibian:{label:"両生類",icon:"🐸",env:"飼育ケース",plural:"両生類",intro:"生体の導入日"}};
function tankCategory(t){return t?.category&&categoryMeta[t.category]?t.category:"aquarium"}
function categoryLabel(c){return categoryMeta[c]?.label||categoryMeta.aquarium.label}
function categoryIcon(c){return categoryMeta[c]?.icon||"🐟"}
function isWaterCategory(c){return c==="aquarium"||c==="amphibian"}
const aquariumLogTypes=["water","topup","filter","wool","feed","refusal","quality","light","co2","fertilizer","waterlevel","trim","layout","salt","medication","equipment","outage","intro","move","death"];
const reptileLogTypes=["feed","refusal","mist","drink","clean","environment","light","uvb","basking","heater","night","measurement","health","stool","shed","treatment","breeding","growthphoto"];
const amphibianLogTypes=["water","topup","feed","refusal","clean","waterclean","landclean","environment","quality","light","heater","mist","drink","measurement","health","stool","shed","treatment","breeding","growthphoto"];
function logTypesForTank(t){const c=tankCategory(t);return c==="reptile"?reptileLogTypes.slice():c==="amphibian"?amphibianLogTypes.slice():aquariumLogTypes.slice()}
function isFavorite(t){return !!t?.favorite}
function toggleFavorite(tid){const t=data.tanks.find(x=>x.id===tid);if(!t)return;t.favorite=!t.favorite;save()}
function latestQuality(tid){return data.logs.filter(x=>x.tankId===tid&&x.type==="quality").sort((a,b)=>b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id)))[0]||null}
function qualityAnomalies(tid){const x=latestQuality(tid);if(!x?.quality)return [];const q=x.quality,a=[];if(q.no2>0)a.push(`NO₂が${q.no2}：検出されています`);if(q.nh3>0)a.push(`NH₃/NH₄が${q.nh3}：検出されています`);if(q.temp>0&&(q.temp<18||q.temp>32))a.push(`水温${q.temp}℃：大きく外れている可能性があります`);return a}
function renderQualityAlert(tid){const a=qualityAnomalies(tid);if(!a.length)return `<div class="anomaly-box anomaly-ok">✓ 最新の水質測定では、簡易アラート条件に該当する項目はありません。</div>`;return `<div class="anomaly-box"><b>⚠️ 水質・環境の確認</b><br>${a.map(esc).join('<br>')}<div class="small" style="margin-top:6px">最新の測定値を基準にした簡易アラートです。種類ごとの適正値は生体によって異なります。</div></div>`}

function typeLabel(type){return {water:"💧 水換え",topup:"💧 足し水",filter:"🧽 フィルター掃除",wool:"🧻 ウール交換",feed:"🍽️ 給餌",refusal:"🚫 拒食",quality:"🧪 水質測定",mist:"💦 霧吹き・加湿",drink:"🚰 飲み水交換",clean:"🧹 飼育環境の掃除",environment:"🌡️ 環境記録",light:"💡 ライト",basking:"☀️ バスキング",heater:"🔥 ヒーター",co2:"💨 CO₂",fertilizer:"🌱 肥料・添加剤",waterlevel:"📏 水位",trim:"✂️ トリミング",layout:"🪨 レイアウト変更",salt:"🧂 塩・薬剤添加",medication:"💊 薬浴",equipment:"🔧 機材交換",uvb:"☀️ UVB管理",night:"🌙 夜間環境",breeding:"🥚 繁殖・産卵",growthphoto:"📸 成長写真",outage:"⚡ 停電・機器トラブル",intro:"🐟 生体導入",move:"↔️ 生体移動",death:"⚰️ 死亡",waterclean:"💧 水場清掃",landclean:"🌿 陸場清掃",weight:"⚖️ 体重測定",size:"📏 体長測定",measurement:"📏⚖️ 身体測定",health:"🩺 健康チェック",stool:"💩 排泄",shed:"🐸 脱皮",treatment:"🩹 治療・投薬"}[type]||"📝 記録"}
function openTank(id=null,categoryOverride=null){
 const t=id?data.tanks.find(x=>x.id===id):null;
 const cat=categoryOverride||tankCategory(t), aq=cat==="aquarium", water=isWaterCategory(cat);
 const m=t?.layoutMaterials||{};
 const icon=categoryIcon(cat), label=categoryLabel(cat);
 openModal(`<div class="row"><div><div class="title">${t?"⚙️ "+label+"設定":"＋ 飼育環境を追加"}</div><div class="small">必要なところだけ入力すればOKです。</div></div><button class="secondary" onclick="closeModal()">閉じる</button></div>
 <div class="settings-section"><div class="settings-head"><div class="settings-icon">${icon}</div><div><b>カテゴリー</b><span>操作感は共通のまま、項目だけ切り替わります。</span></div></div><div class="field"><label>飼育カテゴリー</label><select id="tcat" data-current="${cat}" onchange="changeTankCategory(this.value,'${id||''}')"><option value="aquarium" ${cat==="aquarium"?"selected":""}>🐟 アクアリウム</option><option value="reptile" ${cat==="reptile"?"selected":""}>🦎 爬虫類</option><option value="amphibian" ${cat==="amphibian"?"selected":""}>🐸 両生類</option></select></div></div>
 <div class="settings-section"><div class="settings-head"><div class="settings-icon">📷</div><div><b>飼育環境の写真</b><span>現在の${label}を分かりやすく残す</span></div></div><input id="tp" type="file" accept="image/*" onchange="previewTankPhoto(this)"><div class="small">写真は自動圧縮して保存容量を抑えます。</div><div id="photoPreview">${t?.photo?`<img src="${t.photo}" style="width:100%;max-height:180px;object-fit:cover;border-radius:12px;margin-top:10px">`:''}</div></div>

let manualVolume=false;
function calcTankVolume(){
 const w=+document.getElementById("tw").value||0;
 const d=+document.getElementById("td").value||0;
 const h=+document.getElementById("th").value||0;
 const g=(+document.getElementById("glass").value||0)/10; // mm -> cm
 const wh=+document.getElementById("waterHeight").value||0;
 const innerW=Math.max(0,w-2*g);
 const innerD=Math.max(0,d-2*g);
 const innerH=Math.max(0,h-2*g);
 const actualH=Math.min(wh||innerH,innerH);
 const v=innerW*innerD*actualH/1000;
 const tv=document.getElementById("tv");
 if(v>0){
   tv.value=Math.round(v*10)/10;
   document.getElementById("volHint").textContent=
     `内寸：約${Math.round(innerW*10)/10}×${Math.round(innerD*10)/10}×${Math.round(innerH*10)/10} cm ／ 水量：約${Math.round(v*10)/10} L`;
 }else{
   tv.value="";
   document.getElementById("volHint").textContent="外寸・ガラス厚・水位を入力すると自動計算します。";
 }
}
function calcWater(){
 const vol=+document.getElementById("waterVol").value||0;
 const liters=+document.getElementById("ll").value||0;
 const percent=+document.getElementById("lp").value||0;
 const fractionEl=document.getElementById("lfraction");
 const fraction=String(fractionEl?.value||"").trim();
 const out=document.getElementById("waterCalc");
 if(!vol){out.textContent="水量が登録されていません。水槽情報を編集してください。";return}
 if(document.activeElement?.id==="lfraction" && fraction){
   const m=fraction.match(/^(\d+(?:\.\d+)?)\s*\/\s*(\d+(?:\.\d+)?)$/);
   if(m && +m[1]>=0 && +m[2]>0){
     const p=Math.min(100,(+m[1]/+m[2])*100);
     document.getElementById("lp").value=Math.round(p*10)/10;
     document.getElementById("ll").value=Math.round(vol*p/100*10)/10;
   }
 } else if(document.activeElement?.id==="lp" && percent>0){
   document.getElementById("ll").value=Math.round(vol*percent/100*10)/10;
 } else if(document.activeElement?.id==="ll" && liters>0){
   document.getElementById("lp").value=Math.round(liters/vol*1000)/10;
 }
 const l=+document.getElementById("ll").value||0,p=+document.getElementById("lp").value||0;
 out.textContent=(l||p)?`基準水量：約${vol} L → 水換え ${fraction?fraction+"（":""}${p||0}%${fraction?")":""} ≒ ${l||0} L`:`基準水量：約${vol} L`;
}
function compressImageFile(file,max=1100,quality=.72){return new Promise((resolve,reject)=>{if(!file)return resolve("");if(file.size>12*1024*1024)return reject(new Error("写真は12MB以下にしてください。"));const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext("2d").drawImage(img,0,0,c.width,c.height);resolve(c.toDataURL("image/jpeg",quality))};img.onerror=reject;img.src=r.result};r.onerror=reject;r.readAsDataURL(file)})}
async function previewTankPhoto(input){const f=input.files?.[0];if(!f)return;try{const src=await compressImageFile(f);const el=document.getElementById("photoPreview");if(el)el.innerHTML=`<img src="${src}" style="width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-top:10px"><div class="small" style="margin-top:6px">保存時に軽量化しています。</div>`;input.dataset.compressed=src}catch(e){alert(e.message||"写真を読み込めませんでした。");input.value=""}}
function sortFish(fish=[]){return [...fish].sort((a,b)=>{
 const ad=a.date||"9999-12-31",bd=b.date||"9999-12-31";
 return ad.localeCompare(bd)||String(a.name||"").localeCompare(String(b.name||""));
})}
function fishRows(fish=[]){return sortFish(fish).map(f=>`<div class="fish-item" data-photo="${esc(f.photo||"")}"><div class="fish-name-wrap"><input class="fish-name" value="${esc(f.name||"")}" placeholder="生体名"><input class="fish-nickname" value="${esc(f.nickname||"")}" placeholder="愛称（任意）"></div><input class="fish-count" type="number" min="1" value="${Math.max(1,+f.count||1)}"><input class="fish-date" type="date" value="${esc(f.date||"")}"><div class="item-photo-btn">${f.photo?`<img class="item-thumb" src="${f.photo}" alt="写真" onclick="openImagePreview(this.src,'${esc(f.nickname||f.name||"生体")}')">`:`<div class="item-photo-empty">📷</div>`}<input type="file" accept="image/*" onchange="readItemPhoto(this)"></div><button type="button" onclick="this.parentElement.remove()">×</button></div>`).join("")}
function addFishRow(){const box=document.getElementById("fishRows");if(!box)return;box.insertAdjacentHTML("beforeend",`<div class="fish-item" data-photo=""><div class="fish-name-wrap"><input class="fish-name" placeholder="生体名"><input class="fish-nickname" placeholder="愛称（任意）"></div><input class="fish-count" type="number" min="1" value="1"><input class="fish-date" type="date"><div class="item-photo-btn"><div class="item-photo-empty">📷</div><input type="file" accept="image/*" onchange="readItemPhoto(this)"></div><button type="button" onclick="this.parentElement.remove()">×</button></div>`)}
function collectFish(){return sortFish([...document.querySelectorAll("#fishRows .fish-item")].map(r=>({name:r.querySelector(".fish-name")?.value.trim()||"",nickname:r.querySelector(".fish-nickname")?.value.trim()||"",count:Math.max(1,+r.querySelector(".fish-count")?.value||1),date:r.querySelector(".fish-date")?.value||"",photo:r.dataset.photo||"",size:r.dataset.size||"",growth:(()=>{try{return JSON.parse(r.dataset.growth||"[]")}catch(e){return []}})()})).filter(f=>f.name))}
function sortPlants(plants=[]){return [...plants].sort((a,b)=>{const ad=a.date||"9999-12-31",bd=b.date||"9999-12-31";return ad.localeCompare(bd)||String(a.name||"").localeCompare(String(b.name||""))})}
function plantRows(plants=[]){return sortPlants(plants).map(p=>`<div class="plant-item" data-photo="${esc(p.photo||"")}"><input class="plant-name" value="${esc(p.name||"")}" placeholder="例：ロタラ・ナンセアン"><input class="plant-count" type="number" min="1" value="${Math.max(1,+p.count||1)}"><input class="plant-date" type="date" value="${esc(p.date||"")}"><div class="item-photo-btn">${p.photo?`<img class="item-thumb" src="${p.photo}" alt="写真" onclick="openImagePreview(this.src,'${esc(p.name||"水草")}' )">`:`<div class="item-photo-empty">📷</div>`}<input type="file" accept="image/*" onchange="readItemPhoto(this)"></div><button type="button" onclick="this.parentElement.remove()">×</button></div>`).join("")}
function addPlantRow(){const box=document.getElementById("plantRows");if(!box)return;box.insertAdjacentHTML("beforeend",`<div class="plant-item" data-photo=""><input class="plant-name" placeholder="例：ロタラ・ナンセアン"><input class="plant-count" type="number" min="1" value="1"><input class="plant-date" type="date"><div class="item-photo-btn"><div class="item-photo-empty">📷</div><input type="file" accept="image/*" onchange="readItemPhoto(this)"></div><button type="button" onclick="this.parentElement.remove()">×</button></div>`)}
function collectPlants(){return sortPlants([...document.querySelectorAll("#plantRows .plant-item")].map(r=>({name:r.querySelector(".plant-name")?.value.trim()||"",count:Math.max(1,+r.querySelector(".plant-count")?.value||1),date:r.querySelector(".plant-date")?.value||"",photo:r.dataset.photo||""})).filter(p=>p.name))}

function changeTankCategory(value,id){
 const current=document.getElementById("tcat")?.dataset.current||"";
 if(current===value)return;
 if(!confirm("カテゴリーを切り替えると入力項目も変わります。未保存の入力は失われます。切り替えますか？")){document.getElementById("tcat").value=current;return;}
 openTank(id||null,value);
}
function saveTank(id){
 const name=document.getElementById("tn").value.trim(); if(!name)return alert("名前を入力してください。");
 const old=id?data.tanks.find(x=>x.id===id):null;
 const cat=document.getElementById("tcat")?.value||tankCategory(old);
 const photoInput=document.getElementById("tp");
 const finish=(photo)=>{
  const history=Array.isArray(old?.photoHistory)?[...old.photoHistory]:[];
  if(photo && photo!==old?.photo) history.unshift({date:today(),src:photo});
  const obj={id:id||Date.now().toString(),name,category:cat,w:+document.getElementById("tw")?.value||0,d:+document.getElementById("td")?.value||0,h:+document.getElementById("th")?.value||0,glass:+document.getElementById("glass")?.value||0,waterHeight:+document.getElementById("waterHeight")?.value||0,volume:+document.getElementById("tv")?.value||0,targetTemp:+document.getElementById("targetTemp")?.value||0,targetHumidity:+document.getElementById("targetHumidity")?.value||0,baskingTempTarget:+document.getElementById("baskingTempTarget")?.value||old?.baskingTempTarget||0,nightTempTarget:+document.getElementById("nightTempTarget")?.value||old?.nightTempTarget||0,uvb:document.getElementById("uvb")?.value.trim()||old?.uvb||"",heatingEquipment:document.getElementById("heatingEquipment")?.value.trim()||old?.heatingEquipment||"",shelter:document.getElementById("shelter")?.value.trim()||old?.shelter||"",substrate:document.getElementById("substrate")?.value.trim()||old?.substrate||"",envNote:document.getElementById("envNote")?.value.trim()||old?.envNote||"",envLayout:document.getElementById("envLayout")?.value.trim()||old?.envLayout||"",livestock:document.getElementById("tl")?.value.trim()||"",waterCycle:Math.max(1,+document.getElementById("cycle")?.value||7),waterVolume:+document.getElementById("waterVolume")?.value||old?.waterVolume||0,waterDepth:+document.getElementById("waterDepth")?.value||old?.waterDepth||0,landArea:document.getElementById("landArea")?.value.trim()||old?.landArea||"",branchRock:document.getElementById("branchRock")?.value.trim()||old?.branchRock||"",plantsDecor:document.getElementById("plantsDecor")?.value.trim()||old?.plantsDecor||"",equipment:document.getElementById("equipment")?.value.trim()||old?.equipment||"",waterTempTarget:+document.getElementById("waterTempTarget")?.value||old?.waterTempTarget||0,photo:photo||old?.photo||"",photoHistory:history,setupDate:document.getElementById("setupDate")?.value||"",introDate:document.getElementById("introDate")?.value||"",fish:collectFish(),plants:cat==="aquarium"?collectPlants():(old?.plants||[]),fishChanges:Array.isArray(old?.fishChanges)?old.fishChanges:[],layoutMaterials:cat==="aquarium"?{soil:document.getElementById("msoil")?.value.trim()||"",wood:document.getElementById("mwood")?.value.trim()||"",stone:document.getElementById("mstone")?.value.trim()||"",sand:document.getElementById("msand")?.value.trim()||"",other:document.getElementById("mother")?.value.trim()||""}:(old?.layoutMaterials||{}),memo:document.getElementById("tmemo")?.value.trim()||""};
  if(id){data.tanks=data.tanks.map(x=>x.id===id?obj:x)}else data.tanks.push(obj);
  closeModal();save();
 };
 if(photoInput?.dataset.compressed)finish(photoInput.dataset.compressed);else if(photoInput?.files?.[0])compressImageFile(photoInput.files[0]).then(finish).catch(e=>alert(e.message||"写真を読み込めませんでした。"));else finish();

function homeVisibility(){
 const base={summary:true,dashboard:true,latest:true,recent:true,allHistory:true};
 const saved=(data.homeVisibility&&typeof data.homeVisibility==='object')?data.homeVisibility:{};
 const legacy=data.features||{};
 // 旧バージョンの「dashboard/latest/recent」設定も一度だけ引き継ぐ
 for(const k of Object.keys(base)) if(saved[k]===undefined && legacy[k]!==undefined) saved[k]=legacy[k]!==false;

 return data.homeVisibility;
}

function fmtDate(d){return d?d.replaceAll("-","/"):"—"}
function daysSince(dateStr){
 if(!dateStr)return null;
 const a=new Date(dateStr+"T00:00:00");
 const b=new Date(); b.setHours(0,0,0,0);
 return Math.floor((b-a)/86400000);
}
function addDays(dateStr,n){
 const d=new Date((dateStr||today())+"T00:00:00"); d.setDate(d.getDate()+n);
 return d.toISOString().slice(0,10);
}
function waterDueDate(t,log){ return addDays(log?.date||today(), Math.max(1,+t.waterCycle||7)); }
function waterStatus(t,log){
 const cycle=Math.max(1,+t.waterCycle||7);
 if(!log){ const due=waterDueDate(t,null); return `<span class="water-status none">水換え記録なし ・ 初回目安 ${fmtDate(due)}</span>`; }
 const d=daysSince(log.date), remain=cycle-d, due=waterDueDate(t,log);
 if(remain<0)return `<span class="water-status overdue">⚠ 水換え期限超過 ${Math.abs(remain)}日（期限 ${fmtDate(due)}）</span>`;
 if(remain===0)return `<span class="water-status due">💧 今日が水換え期限です（${cycle}日周期）</span>`;
 if(remain<=2)return `<span class="water-status due">💧 水換えまであと${remain}日（期限 ${fmtDate(due)}）</span>`;
 return `<span class="water-status ok">✓ 水換えまであと${remain}日（${cycle}日周期）</span>`;
}
function tankAgeText(date){const n=daysSince(date);return n===null?"—":n<0?"未開始":`開始から${n}日`}
function currentFishCount(t,fishName){
 let base=(t.fish||[]).filter(f=>f.name===fishName).reduce((n,f)=>n+(+f.count||0),0);
 for(const c of (t.fishChanges||[])){if(c.name===fishName)base+=+c.delta||0}
 return Math.max(0,base)
}
function fishSpecies(t){return [...new Set((t.fish||[]).map(f=>f.name).filter(Boolean))]}
function fishDisplayName(f){return f.nickname?`${f.nickname}（${f.name}）`:f.name}
function fishCurrentEntries(t){const map=new Map();for(const f of (t.fish||[])){if(!f.name)continue;const cur=currentFishCount(t,f.name);if(cur<=0)continue;if(!map.has(f.name))map.set(f.name,{...f,count:cur});}return [...map.values()]}
function compatibility(a,b){
 const A=String(a||"").toLowerCase(),B=String(b||"").toLowerCase();
 const small=/ネオン|テトラ|ラスボラ|ボララス|グッピー|メダカ|カージナル|ラミーノーズ|エビ|シュリンプ|オトシン|小型/.test(B);
 const pred=/オスカー|アストロノータス|シクリッド|フラワートーマン|トーマン|スネークヘッド|パーチ|ナイフフィッシュ|キクラ/.test(A);
 const bichir=/ポリプテルス|ビキール|エンドリケリー|デルヘジ/.test(B);
 if(pred&&small)return {icon:"🔴",label:"非推奨",note:"大型の捕食性魚は口に入る小型魚を捕食する可能性があります。サイズ差だけでなく、逃げ場と水槽の広さも重要です。",rule:"小型魚・エビ類は避けるのが基本"};
 if((/オスカー|アストロノータス/.test(A))&&bichir)return {icon:"🟡",label:"条件付き",note:"ポリプテルスはサイズ・体格が十分なら候補になりますが、個体差と縄張り争いがあります。十分な底面積、隠れ家、同程度のサイズを確保してください。",rule:"同程度のサイズ＋広い水槽＋隔離できる準備"};
 if(/ポリプテルス|ビキール|エンドリケリー|デルヘジ/.test(A)&&small)return {icon:"🔴",label:"非推奨",note:"ポリプテルスも口に入るサイズの魚は捕食対象になり得ます。夜行性で底層を使うため、同居魚の休息場所も確認が必要です。",rule:"口に入るサイズは避ける"};
 if(/コリドラス|オトシン|プレコ/.test(A)&&/ネオン|テトラ|ラスボラ|メダカ/.test(B))return {icon:"🟢",label:"比較的良好",note:"性格やサイズが合えば比較的合わせやすい組み合わせです。ただし水温・pH・硬度・遊泳域が重なるか確認してください。",rule:"水質条件とサイズを確認"};
 return {icon:"🟡",label:"要条件確認",note:"相性は種類だけでは決まりません。成魚サイズ、口の大きさ、性格・縄張り性、水温・pH・硬度、遊泳層、水槽の底面積を確認してください。",rule:"個体差があるため導入後は行動を観察"};
}

}
function previewGrowthPhoto(input){const f=input.files?.[0];if(!f)return;if(f.size>10*1024*1024){alert("写真は10MB以下にしてください。");input.value="";return}const r=new FileReader();r.onload=()=>{const img=new Image();img.onload=()=>{const max=1100,scale=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement("canvas");c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext("2d").drawImage(img,0,0,c.width,c.height);input.dataset.compressed=c.toDataURL("image/jpeg",.78);const p=document.getElementById("growthPhotoPreview");if(p)p.innerHTML=`<img src="${input.dataset.compressed}" style="width:100%;max-height:180px;object-fit:cover;border-radius:10px;margin-top:8px">`};img.src=r.result};r.readAsDataURL(f)}

function openFishCard(tankId,name){
 const t=data.tanks.find(x=>x.id===tankId);if(!t)return;
 const fish=(t.fish||[]).find(f=>f.name===name)||{};
 const cur=currentFishCount(t,name);
 const others=fishCurrentEntries(t).filter(f=>f.name!==name);
 const cat=tankCategory(t),lifeIcon=categoryIcon(cat),lifeLabel=cat==="aquarium"?"魚":"生体";
 let html=`<div class="row"><div><div class="title">${lifeIcon} ${esc(fishDisplayName(fish))}</div><div class="small">${lifeLabel}のカルテ</div></div><button class="secondary" onclick="closeModal()">閉じる</button></div>`;

function priorityForTank(t){

   if(q?.quality){const z=q.quality;if(+z.no2>0)items.push({level:3,icon:"🔴",text:`NO₂ ${z.no2}：要確認`});if(+z.nh3>0)items.push({level:3,icon:"🔴",text:`NH₃/NH₄ ${z.nh3}：要確認`});if(z.temp!=null&&(+z.temp<18||+z.temp>32))items.push({level:2,icon:"🟠",text:`水温 ${z.temp}℃：設定値を確認`})}
 }else if(c==="reptile"){
   const env=data.logs.filter(x=>x.tankId===t.id&&x.type==="environment").sort((a,b)=>b.date.localeCompare(a.date))[0];
   if(!env)items.push({level:2,icon:"🟡",text:"まだ環境記録がありません"});
 }
 const info=c==="aquarium"?(t.fish||[]).map(f=>latestInfoFor(f.name)).filter(Boolean):[];
 if(info.some(x=>x.risk==="high"))items.push({level:3,icon:"🔴",text:"生体の飼育・混泳リスクを確認"});else if(info.some(x=>x.risk==="medium"))items.push({level:2,icon:"🟡",text:"生体の飼育条件を確認"});

function growthLineChart(rows,type){
 const points=rows.filter(x=>Number.isFinite(+(type==="weight"?x.weight:x.size))&&((x.type==="measurement")||(x.type===type))).sort((a,b)=>a.date.localeCompare(b.date)||String(a.id).localeCompare(String(b.id))).slice(-12);
 if(points.length<2)return `<div class="small">${type==="weight"?"体重":"体長"}は2回以上測定すると折れ線グラフが表示されます。</div>`;
 const vals=points.map(x=>+(type==="weight"?x.weight:x.size));
 const min=Math.min(...vals),max=Math.max(...vals),pad=(max-min)||Math.max(max*.08,.5),lo=Math.max(0,min-pad),hi=max+pad;
 const W=560,H=190,L=42,R=12,T=18,B=34,iw=W-L-R,ih=H-T-B;
 const px=i=>L+(points.length===1?iw/2:i*iw/(points.length-1));
 const py=v=>T+(hi-v)/(hi-lo)*ih;
 const poly=points.map((x,i)=>`${px(i).toFixed(1)},${py(+(type==="weight"?x.weight:x.size)).toFixed(1)}`).join(" ");
 const mid=py((hi+lo)/2),unit=type==="weight"?"g":"cm";
 const grid=`<line x1="${L}" y1="${py(hi)}" x2="${W-R}" y2="${py(hi)}" stroke="var(--line)"/><line x1="${L}" y1="${mid}" x2="${W-R}" y2="${mid}" stroke="var(--line)"/><line x1="${L}" y1="${py(lo)}" x2="${W-R}" y2="${py(lo)}" stroke="var(--line)"/>`;
 const labels=points.map((x,i)=>`<text x="${px(i)}" y="${H-10}" text-anchor="middle" fill="var(--muted)" font-size="9">${fmtDate(x.date).slice(5)}</text>`).join("");
 const dots=points.map((x,i)=>`<circle cx="${px(i)}" cy="${py(+(type==="weight"?x.weight:x.size))}" r="4" fill="var(--aqua)" stroke="#07101c" stroke-width="2"><title>${fmtDate(x.date)}：${type==="weight"?x.weight:x.size}${unit}</title></circle>`).join("");
 const latest=vals[vals.length-1],prev=vals[vals.length-2],diff=latest-prev;
 return `<div class="growth-chart-wrap"><div class="growth-chart-head"><b>${type==="weight"?"⚖️ 体重の推移":"📏 体長の推移"}</b><span>最新 ${latest}${unit}　前回比 ${diff>=0?"+":""}${diff.toFixed(1)}${unit}</span></div><svg class="growth-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${type==="weight"?"体重":"体長"}の推移グラフ">${grid}<polyline points="${poly}" fill="none" stroke="var(--aqua)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>${dots}${labels}<text x="6" y="${py(hi)+4}" fill="var(--muted)" font-size="9">${hi.toFixed(1)}</text><text x="6" y="${mid+4}" fill="var(--muted)" font-size="9">${((hi+lo)/2).toFixed(1)}</text><text x="6" y="${py(lo)+4}" fill="var(--muted)" font-size="9">${lo.toFixed(1)}</text></svg></div>`;
}
function growthSummary(tid){
 const rows=data.logs.filter(x=>x.tankId===tid&&(x.type==="measurement"||x.type==="weight"||x.type==="size")).sort((a,b)=>a.date.localeCompare(b.date)||String(a.id).localeCompare(String(b.id))).slice(-12);
 const photos=data.logs.filter(x=>x.tankId===tid&&x.type==="growthphoto"&&x.photo).sort((a,b)=>a.date.localeCompare(b.date)||String(a.id).localeCompare(String(b.id))).slice(-6);
 if(!rows.length&&!photos.length)return `<div class="small">体重・体長・成長写真を記録すると、ここに成長の推移が表示されます。</div>`;
 const latestW=[...rows].reverse().find(x=>Number.isFinite(+x.weight)&&+x.weight>0),latestS=[...rows].reverse().find(x=>Number.isFinite(+x.size)&&+x.size>0);
 const list=rows.map(x=>`${fmtDate(x.date)}　${x.type==="measurement"?`📏⚖️ ${x.size?`${x.size}cm`:"—"} / ${x.weight?`${x.weight}g`:"—"}`:x.type==="weight"?`⚖️ ${x.weight}g`:`📏 ${x.size}cm`}`).join("<br>");
 return `${rows.length?`<div class="feature-grid"><div class="feature-card"><h4>最新体重</h4><p>${latestW?`${latestW.weight} g<br>${fmtDate(latestW.date)}`:"—"}</p></div><div class="feature-card"><h4>最新体長</h4><p>${latestS?`${latestS.size} cm<br>${fmtDate(latestS.date)}`:"—"}</p></div></div><div class="growth-charts">${growthLineChart(rows,"weight")}${growthLineChart(rows,"size")}</div><div class="timeline-item" style="margin-top:10px"><div><b>最近12件</b><br>${list}</div></div>`:""}${photos.length?`<div style="margin-top:12px"><b>📸 成長写真比較</b><div class="photo-history" style="margin-top:8px">${photos.map(x=>`<div><img src="${x.photo}" alt="成長写真 ${fmtDate(x.date)}" onclick="openImagePreview(this.src,'成長写真 ${fmtDate(x.date)}')"><div class="small" style="margin-top:4px">${fmtDate(x.date)}${x.value?` ・ ${esc(x.value)}`:""}</div></div>`).join("")}</div></div>`:""}`;
}

function historyGroups(logs,{tankId=null,selectMode=false}={}){
 const order=["water","topup","feed","refusal","quality","filter","wool","light","co2","fertilizer","waterlevel","trim","layout","salt","medication","equipment","outage","mist","drink","clean","uvb","night","breeding","growthphoto","waterclean","landclean","environment","measurement","weight","size","health","stool","shed","treatment","basking","heater","intro","move","death"];
 const groups={};
 order.forEach(k=>groups[k]=[]);
 logs.forEach(x=>{if(!groups[x.type])groups[x.type]=[];groups[x.type].push(x)});
 return Object.entries(groups).filter(([,arr])=>arr.length).map(([type,arr],i)=>`<details class="history-group" ${i<2?"open":""}><summary><span>${types[type]} <span class="history-count">${arr.length}件</span></span></summary><div class="history-list">${arr.map(x=>selectMode?`<div class="history-select-item"><input class="history-check" type="checkbox" data-log-id="${x.id}" onchange="updateHistorySelection()"><label><div class="history-date">${fmtDate(x.date)}</div><div class="history-detail">${historyDetail(x)}</div></label><span class="history-count">${type}</span></div>`:logHTML(x)).join("")}</div></details>`).join("");
}

 const c=document.getElementById('historySelectedCount'),b=document.getElementById('historyDeleteBtn');if(c)c.textContent=`${n}件選択`;if(b){b.disabled=!n;b.textContent=`🗑️ ${n}件削除`}
}
function toggleAllHistory(el){document.querySelectorAll('.history-check[data-log-id]').forEach(c=>c.checked=el.checked);updateHistorySelection()}
function deleteSelectedHistory(tankId){
 const ids=[...document.querySelectorAll('.history-check[data-log-id]:checked')].map(x=>x.dataset.logId);if(!ids.length)return;
 if(!confirm(`${ids.length}件の履歴を削除しますか？`))return;
 data.logs=data.logs.filter(x=>!ids.includes(String(x.id)));save();showTankLogs(tankId);
}
function showAllLogs(){
 const logs=[...data.logs].filter(x=>{const t=data.tanks.find(v=>v.id===x.tankId);return t&&logTypesForTank(t).includes(x.type)&&x.type!=="cost"}).sort((a,b)=>b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id)));
 openModal(`<div class="row"><div><div class="title">全履歴</div><div class="small">水槽・ジャンルごとに確認できます</div></div><button class="secondary" onclick="closeModal()">閉じる</button></div><div class="history-select-row"><button class="secondary" onclick="openAllHistorySelect()">☑️ 選択して削除</button><span class="history-selected-count">複数選択できます</span></div><div class="history-groups">${logs.length?historyGroups(logs):`<div class="empty">まだ記録がありません。</div>`}</div>`);
}
function openAllHistorySelect(){
 const logs=[...data.logs].filter(x=>{const t=data.tanks.find(v=>v.id===x.tankId);return t&&logTypesForTank(t).includes(x.type)&&x.type!=="cost"}).sort((a,b)=>b.date.localeCompare(a.date)||String(b.id).localeCompare(String(a.id)));
 openModal(`<div class="row"><div><div class="title">全履歴を選択</div><div class="small">削除したい履歴にチェックを入れてください</div></div><button class="secondary" onclick="showAllLogs()">戻る</button></div><div class="history-select-row"><label style="display:flex;align-items:center;gap:8px"><input id="historySelectAll" class="history-check" type="checkbox" onchange="toggleAllHistory(this)">すべて選択</label><span id="historySelectedCount" class="history-selected-count">0件選択</span></div><div class="history-groups">${logs.length?historyGroups(logs,{selectMode:true}):`<div class="empty">まだ記録がありません。</div>`}</div><div class="history-deletebar"><button class="secondary" onclick="showAllLogs()">キャンセル</button><button id="historyDeleteBtn" class="danger" disabled onclick="deleteSelectedAllHistory()">🗑️ 0件削除</button></div>`);
}
function deleteSelectedAllHistory(){
 const ids=[...document.querySelectorAll('.history-check[data-log-id]:checked')].map(x=>x.dataset.logId);if(!ids.length)return;
 if(!confirm(`${ids.length}件の履歴を削除しますか？`))return;
 data.logs=data.logs.filter(x=>!ids.includes(String(x.id)));save();showAllLogs();
}
render();
